[project]
name = "ncrsync"
dynamic = ["version"]          # single source of truth: ncrsync/__init__.py
description = "Norton Commander-style terminal file manager for remote SSH hosts with resumable rsync downloads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Markus Wolf" }]
keywords = ["rsync", "ssh", "tui", "file-manager", "textual"]
dependencies = [
    "textual>=8.2.7,<9",
]

[project.urls]
Homepage = "https://github.com/markus-wolf/NCRsync"
Repository = "https://github.com/markus-wolf/NCRsync"

[project.scripts]
ncrsync = "ncrsync.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "ncrsync.__version__" }

# flat layout: the ncrsync/ package lives at the repo root, not under src/
[tool.setuptools.packages.find]
where = ["."]
include = ["ncrsync*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
